{%load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>ABU FIGHT SCHOOL — Ota-ona davomati</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ABU Fight">
  <link rel="apple-touch-icon" sizes="72x72" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="96x96" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="128x128" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="144x144" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="384x384" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="512x512" href="{% static 'img/logo.jpg.jpg' %}">
  <!-- Safari Mobile -->
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <script>(function(){try{var t=localStorage.getItem('afs-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="{% static 'css/davomat.css' %}">
  <link rel="stylesheet" href="{% static 'css/ota-ona.css' %}">
</head>
<body>
  <div class="parent-page">
    <header class="parent-header">
      <div class="logo-icon"><img src="{% static 'img/logo.jpg.jpg' %}" alt="ABU FIGHT SCHOOL"></div>
      <h1>ABU FIGHT SCHOOL</h1>
      <h2 id="groupTitle">—</h2>
      <span class="parent-badge">&#128065; Faqat ko'rish rejimi</span>
      <p id="parentWho" class="parent-who"></p>
      <button type="button" class="btn btn-secondary btn-sm" id="parentLogout" style="margin-top:0.75rem;">Chiqish</button>
    </header>
    <p class="parent-notice">Bu sahifa ota-onalar uchun. Davomat coachlar paneldan saqlangach shu yerda ko‘rinadi.</p>
    <nav class="parent-nav" id="groupNav"></nav>
    <div class="parent-info">
      <span>Murabbiy: <strong id="groupCoach">—</strong></span>
      <span>Jadval: <strong id="groupSchedule">—</strong></span>
      <span>Oy: <strong id="groupMonth">—</strong></span>
    </div>
    <div class="parent-legend">
      <div class="legend-item"><span class="mark mark-present">B</span> Bor</div>
      <div class="legend-item"><span class="mark mark-absent">Y</span> Yo'q</div>
      <div class="legend-item"><span class="mark mark-late">K</span> Kechikdi</div>
      <div class="legend-item"><span class="mark mark-empty">·</span> Bo'sh</div>
    </div>
    <div class="parent-table-wrap">
      <table class="attendance-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <footer class="parent-footer">&copy; 2026 ABU FIGHT SCHOOL — Ota-onalar portali</footer>
  </div>
<script src="{% static 'js/theme.js' %}"></script>
<script src="{% static 'js/data.js' %}"></script>
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/members.js' %}"></script>
<script src="{% static 'js/davomat.js' %}"></script>
<script src="{% static 'js/ota-ona-data.js' %}"></script>
<script src="{% static 'js/ota-ona.js' %}"></script>
</body>
</html>
