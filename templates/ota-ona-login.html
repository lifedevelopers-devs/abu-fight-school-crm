{%load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>ABU FIGHT SCHOOL — Ota-ona kirish</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">

  <!-- iOS PWA Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABU Fight">
<link rel="apple-touch-icon" sizes="72x72" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="96x96" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="128x128" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="144x144" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="152x152" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="384x384" href="{% static 'img/logo.jpg.jpg' %}">
<link rel="apple-touch-icon" sizes="512x512" href="{% static 'img/logo.jpg.jpg' %}">
  <!-- Safari Mobile -->
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <script>(function(){try{var t=localStorage.getItem('afs-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-img">
          <img src="{% static 'img/logo.jpg.jpg' %}" alt="ABU FIGHT SCHOOL">
        </div>
        <h1>ABU FIGHT SCHOOL</h1>
        <p>Ota-onalar portali — bolaning telefon raqami</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="parentLoginForm">
        <div class="form-group">
          <label for="parentPhone">Ota-ona telefoni</label>
          <input type="tel" id="parentPhone" class="form-control" placeholder="+998 90 111 22 01" required autocomplete="tel">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">
          Davomatni ko'rish
        </button>
      </form>

      <p style="text-align:center;margin-top:1.25rem;font-size:0.8rem;">
        <a href="{% url 'login' %}" style="color:var(--text-muted);text-decoration:underline;">Ustozlar paneli</a>
        ·
        <a href="{% url 'maxfiylik' %}" style="color:var(--text-muted);text-decoration:underline;">Maxfiylik</a>
      </p>
    </div>
  </div>

  <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
