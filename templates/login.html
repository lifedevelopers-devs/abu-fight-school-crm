{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>ABU FIGHT SCHOOL — Kirish</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ABU Fight">
  <link rel="apple-touch-icon" sizes="72x72" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="96x96" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="128x128" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="144x144" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="384x384" href="{% static 'img/logo.jpg.jpg' %}">
  <link rel="apple-touch-icon" sizes="512x512" href="{% static 'img/logo.jpg.jpg' %}">

  <!-- Safari Mobile -->
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <script>(function(){try{var t=localStorage.getItem('afs-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-img">
          <img src="{% static 'img/logo.jpg.jpg' %}" alt="ABU FIGHT SCHOOL">
        </div>
        <h1>ABU FIGHT SCHOOL</h1>
        <p>Ustozlar va sportchilar paneli</p>
      </div>

      <!-- Django xatolik xabarini chiqarish uchun shart -->
      {% if error %}
        <div class="login-error" id="loginError" style="display: block; color: #ff4d4d; text-align: center; margin-bottom: 1rem;">{{ error }}</div>
      {% else %}
        <div class="login-error" id="loginError"></div>
      {% endif %}

      <!-- Django POST formasi va CSRF token -->
      <form method="POST" action="{% url 'login' %}" id="loginForm">
        {% csrf_token %}
        <div class="form-group">
          <label for="login">Login</label>
          <input type="text" id="login" name="username" class="form-control" placeholder="Masalan: zokirjoncoach" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Parol</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" class="form-control" placeholder="Parolingiz" required autocomplete="current-password">
            <button type="button" class="toggle-pass" id="togglePass">Ko'rsatish</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;min-height:56px;padding:1rem;margin-top:0.5rem;font-size:1rem;">
          Tizimga kirish
        </button>
      </form>

      <p style="text-align:center;margin-top:1rem;font-size:0.8rem;">
        <a href="{% url 'ota-ona-login' %}" style="color:var(--text-muted);text-decoration:underline;">Ota-onalar portali</a>
        ·
        <a href="{% url 'maxfiylik' %}" style="color:var(--text-muted);text-decoration:underline;">
          Maxfiylik siyosati
        </a>
      </p>

      </div>
    </div>
  </div>

  <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
